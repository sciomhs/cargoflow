appId: ${APP_ID}
---
- runFlow: { when: { visible: "Выйти" }, commands: [ { tapOn: { point: "80%,9%" } } ] }
- extendedWaitUntil: { visible: "Вход по логину", timeout: 30000 }
- tapOn: "Вход по логину"
- extendedWaitUntil: { visible: "Пароль", timeout: 10000 }
- scrollUntilVisible: { element: "Водитель: Асхат Нуртаев.*" }
- tapOn: "Водитель: Асхат Нуртаев.*"
- scrollUntilVisible: { element: "Войти", direction: UP }
- tapOn: "Войти"
- extendedWaitUntil: { visible: "Открыть рейс", timeout: 30000 }
- tapOn: "Открыть рейс"
- extendedWaitUntil: { visible: "Прибыл на выгрузку", timeout: 20000 }
